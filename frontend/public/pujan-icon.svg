<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- プチ麻雀のアイコン: 緑のラシャに象牙色の牌（一筒）。文字を使わず図形だけで描く -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#245442"/>
      <stop offset="0.55" stop-color="#1e4637"/>
      <stop offset="1" stop-color="#142f25"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f4eedb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#felt)"/>
  <g transform="rotate(-8 256 256)">
    <!-- 牌の側面（緑）と縁（象牙の影） -->
    <rect x="146" y="112" width="220" height="300" rx="28" fill="#3c7d63"/>
    <rect x="146" y="100" width="220" height="300" rx="28" fill="#d9cfb3"/>
    <rect x="146" y="84" width="220" height="300" rx="28" fill="url(#ivory)"/>
    <!-- 一筒: 青い輪、赤い芯 -->
    <circle cx="256" cy="234" r="78" fill="none" stroke="#1d4f9a" stroke-width="18"/>
    <circle cx="256" cy="234" r="46" fill="none" stroke="#18763f" stroke-width="10"/>
    <circle cx="256" cy="234" r="22" fill="#b0262f"/>
  </g>
</svg>
